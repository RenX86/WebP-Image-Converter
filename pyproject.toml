[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webp-converter"
version = "2.0.0"
description = "Batch image-to-WebP converter with an interactive terminal UI (TUI) and CLI for Windows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "Pillow>=9.0.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
webp-converter = "webp_converter.main:main"

[tool.setuptools.packages.find]
include = ["webp_converter*"]
