[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webp-tui"
version = "2.0.2"
description = "Batch image-to-WebP converter with an interactive terminal UI (TUI) and CLI for Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "RenX86" },
]
requires-python = ">=3.9"
keywords = ["webp", "image", "converter", "tui", "textual", "pillow", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "Pillow>=9.0.0",
    "rich>=13.0.0",
    "textual>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/RenX86/WebP-Image-Converter"
Repository = "https://github.com/RenX86/WebP-Image-Converter"
Issues = "https://github.com/RenX86/WebP-Image-Converter/issues"

[project.scripts]
webp-converter = "webp_converter.main:main"

[tool.setuptools.packages.find]
include = ["webp_converter*"]

[tool.setuptools.package-data]
webp_converter = ["*.tcss"]
